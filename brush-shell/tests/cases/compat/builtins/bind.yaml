name: "Builtins: bind"
cases:
  - name: "bind succeeds in non-interactive mode"
    stdin: |
      bind > /dev/null 2>&1
      echo "exit: $?"

  - name: "bind -f loads settings and bindings from the shell working directory"
    args: ["run.sh"]
    removed_default_args: ["--input-backend=basic"]
    additional_test_args: ["--input-backend=reedline"]
    ignore_stderr: true
    test_files:
      - path: "run.sh"
        contents: |
          cd settings
          bind -f keys
          printf 'load: %s\n' "$?"
          bind -q menu-complete >/dev/null
          printf 'Tab: %s\n' "$?"
          bind -q history-search-forward >/dev/null
          printf 'history: %s\n' "$?"
          bind -v | grep -E '^set (colored-stats|completion-ignore-case|completion-prefix-display-length|completion-query-items|convert-meta|input-meta|mark-symlinked-directories|match-hidden-files|menu-complete-display-prefix|meta-flag|output-meta|page-completions|show-all-if-ambiguous|show-all-if-unmodified|skip-completed-text|visible-stats) ' | sort
          bind -f missing
          printf 'missing: %s\n' "$?"
      - path: "settings/keys"
        contents: |
          # Load the same state in both shells.
          set meta-flag off
          set input-meta on
          set convert-meta off
          set output-meta on
          set completion-ignore-case on
          set completion-prefix-display-length 4
          set completion-query-items 73
          set mark-symlinked-directories on
          set match-hidden-files off
          set menu-complete-display-prefix on
          set page-completions off
          set show-all-if-ambiguous on
          set show-all-if-unmodified on
          set colored-stats on
          set visible-stats on
          set skip-completed-text on

          "\e[B": history-search-forward
          TAB: menu-complete

  - name: "bind -l"
    args: ["run.sh"]
    removed_default_args: ["--input-backend=basic"]
    additional_test_args: ["--input-backend=reedline"]
    ignore_stderr: true
    min_oracle_version: "5.3" # Added functions in 5.3
    test_files:
      - path: "run.sh"
        contents: |
          # List bindable actions but ignore brush custom entries
          echo "[bind -l]"
          bind -l | grep -v brush- | sort
          echo "bind -l result: ${PIPESTATUS[@]}"

  - name: "bind -f evaluates includes and nested inputrc conditions"
    args: ["run.sh"]
    removed_default_args: ["--input-backend=basic"]
    additional_test_args: ["--input-backend=reedline"]
    ignore_stderr: true
    min_oracle_version: "5.2"
    test_files:
      - path: "run.sh"
        contents: |
          export TERM=xterm-256color
          bind -f settings/input
          echo "status=$?"
          bind -v | grep -E '^set (completion-query-items|completion-prefix-display-length|completion-display-width|print-completions-horizontally|search-ignore-case|bell-style|expand-tilde) ' | sort
      - path: "settings/input"
        contents: |
          set search-ignore-case Off
          $if Bash
            $include extra settings
            $if term=xterm
              set completion-display-width 32
            $else
              set completion-display-width 53
            $endif
          $else
            $include unselected
          $endif
          $if version>=8.0
            $if print-completions-horizontally == on
              set completion-query-items 77
            $endif
          $endif
      - path: "extra settings"
        contents: |
          set print-completions-horizontally on
          set bell-style none
          set expand-tilde on
          set completion-prefix-display-length 6 # trailing comment
      - path: "settings/extra settings"
        contents: |
          set completion-prefix-display-length 19
      - path: "unselected"
        contents: |
          set search-ignore-case on

  - name: "bind -f and bind -m use separate keymaps"
    args: ["run.sh"]
    removed_default_args: ["--input-backend=basic"]
    additional_test_args: ["--input-backend=reedline"]
    ignore_stderr: true
    test_files:
      - path: "run.sh"
        contents: |
          bind -f keys
          bind -m emacs -q menu-complete >/dev/null
          echo "emacs=$?"
          bind -m vi-command -q menu-complete >/dev/null
          echo "vi=$?"
          bind -m emacs-ctlx -q menu-complete-backward >/dev/null
          echo "ctlx=$?"
          bind -m emacs-ctlx -r q
          bind -m emacs-ctlx -q menu-complete-backward >/dev/null
          echo "removed=$?"
      - path: "keys"
        contents: |
          set keymap vi-command
          q: menu-complete
          set keymap emacs-ctlx
          q: menu-complete-backward
          set keymap emacs

  - name: "bind -q/-P/-p"
    args: ["run.sh"]
    removed_default_args: ["--input-backend=basic"]
    additional_test_args: ["--input-backend=reedline"]
    ignore_stderr: true
    test_files:
      - path: "run.sh"
        contents: |
          # Basic-check some known bindings
          well_known_func="clear-screen"

          echo "[bind -q]"
          bind -q ${well_known_func}
          echo "bind -q result: ${PIPESTATUS[@]}"

          echo "[bind -P]"
          bind -P | grep ${well_known_func}
          echo "bind -P result: ${PIPESTATUS[@]}"

          echo "[bind -p]"
          bind -p | grep ${well_known_func}
          echo "bind -p result: ${PIPESTATUS[@]}"

  - name: "bind -x/-X/-r/-u"
    args: ["run.sh"]
    removed_default_args: ["--input-backend=basic"]
    additional_test_args: ["--input-backend=reedline"]
    min_oracle_version: "5.3" # -X output changed in 5.3
    ignore_stderr: true
    test_files:
      - path: "run.sh"
        contents: |
          # Bind a key and check it
          echo "[bind -x]"
          bind -x '"\C-t":echo hi'
          echo "bind -x result: $?"

          echo "[bind -X]"
          bind -X
          echo "bind -X result: $?"

          # Unbind it via -r
          echo "[bind -r]"
          bind -r '\C-t'
          echo "bind -r result: $?"
          bind -X
          echo "bind -X result: $?"
          echo "[bind -r (again)]"
          bind -r '\C-t'
          echo "bind -r (again) result: $?"

          # Unbind via -u
          well_known_func="clear-screen"
          echo "[bind -u]"
          bind -u ${well_known_func}
          echo "bind -u result: $?"
          echo "[bind -q (after -u)]"
          bind -q ${well_known_func}
          echo "bind -q (after -u) result: $?"

  - name: "bind keyseq"
    args: ["run.sh"]
    removed_default_args: ["--input-backend=basic"]
    additional_test_args: ["--input-backend=reedline"]
    ignore_stderr: true
    test_files:
      - path: "run.sh"
        contents: |
          well_known_func="clear-screen"
          bind -u ${well_known_func} # Ensure it's unbound first

          # Bind a keyseq
          echo "[bind keyseq]"
          bind '"\C-t":clear-screen'
          echo "bind keyseq result: $?"

          # List current bindings
          bind -q ${well_known_func}
          echo "bind -q result: $?"

  - name: "bind macro 1"
    args: ["run.sh"]
    removed_default_args: ["--input-backend=basic"]
    additional_test_args: ["--input-backend=reedline"]
    ignore_stderr: true
    test_files:
      - path: "run.sh"
        contents: |
          key_to_bind='\C-r'

          echo "[bind -S (pre)]"
          bind -S | grep "${key_to_bind}"
          echo "bind -S result: ${PIPESTATUS[@]}"

          echo "[bind -s (pre)]"
          bind -s | grep "${key_to_bind}"
          echo "bind -s result: ${PIPESTATUS[@]}"

          echo "[bind macro]"
          bind '"\C-r": "\e[0;1A\e[0;0A"'
          echo "bind macro result: $?"

          echo "[bind -S]"
          bind -S | grep "${key_to_bind}"
          echo "bind -S result: ${PIPESTATUS[@]}"

          echo "[bind -s]"
          bind -s | grep "${key_to_bind}"
          echo "bind -s result: ${PIPESTATUS[@]}"

          echo "[bind -r]"
          bind -r "${key_to_bind}"
          echo "bind -r result: ${PIPESTATUS[@]}"

          echo "[bind -s (after -r)]"
          bind -s | grep "${key_to_bind}"
          echo "bind -s (after -r) result: ${PIPESTATUS[@]}"

          echo "[bind -S (after -r)]"
          bind -S | grep "${key_to_bind}"
          echo "bind -S (after -r) result: ${PIPESTATUS[@]}"

  - name: "bind macro 2"
    args: ["run.sh"]
    removed_default_args: ["--input-backend=basic"]
    additional_test_args: ["--input-backend=reedline"]
    ignore_stderr: true
    test_files:
      - path: "run.sh"
        contents: |
          key_to_bind='\ec'

          echo "[bind macro]"
          bind '"\ec": " \C-b\C-k`something`\e\C-e"'
          echo "bind macro result: $?"

          echo "[bind -S]"
          bind -S | grep "${key_to_bind}"
          echo "bind -S result: ${PIPESTATUS[@]}"

  - name: "bind -m takes each keymap name"
    args: ["run.sh"]
    removed_default_args: ["--input-backend=basic"]
    additional_test_args: ["--input-backend=reedline"]
    ignore_stderr: true
    test_files:
      - path: "run.sh"
        contents: |
          for keymap in emacs emacs-standard emacs-meta emacs-ctlx vi vi-move vi-command vi-insert; do
            bind -m "${keymap}" -p >/dev/null
            echo "${keymap}: $?"
          done
          bind -memacs -p >/dev/null; echo "attached: $?"
          bind -m; echo "no keymap: $?"

  - name: "bind -m with an unknown keymap fails with status 1"
    known_failure: true # TODO(bind): fails with status 2
    args: ["run.sh"]
    removed_default_args: ["--input-backend=basic"]
    additional_test_args: ["--input-backend=reedline"]
    ignore_stderr: true
    test_files:
      - path: "run.sh"
        contents: |
          bind -m bogus -p >/dev/null; echo "rc=$?"

  - name: "readline terminal settings round trip through bind -f and -v"
    args: ["run.sh"]
    removed_default_args: ["--input-backend=basic"]
    additional_test_args: ["--input-backend=reedline"]
    ignore_stderr: true
    test_files:
      - path: "terminal.inputrc"
        contents: |
          set active-region-start-color \e[35m
          set active-region-end-color \e[39m
          set bind-tty-special-chars off
          set blink-matching-paren on
          set byte-oriented on
          set echo-control-characters off
          set enable-active-region on
          set enable-keypad on
          set enable-meta-key off
          set force-meta-prefix on
          set horizontal-scroll-mode on
          set mark-modified-lines on
          set prefer-visible-bell on
          set revert-all-at-newline on
      - path: "run.sh"
        contents: |
          bind -f terminal.inputrc || exit
          bind -v | LC_ALL=C grep -E '^set (active-region-(start|end)-color|bell-style|bind-tty-special-chars|blink-matching-paren|byte-oriented|echo-control-characters|enable-(active-region|keypad|meta-key)|force-meta-prefix|horizontal-scroll-mode|mark-modified-lines|prefer-visible-bell|revert-all-at-newline) ' | LC_ALL=C sort
          bind 'set prefer-visible-bell off'
          bind -v | LC_ALL=C grep -E '^set (prefer-visible-bell|bell-style) ' | LC_ALL=C sort

  - name: "readline numeric settings accept a decimal prefix and clamp negative values"
    args: ["run.sh"]
    removed_default_args: ["--input-backend=basic"]
    additional_test_args: ["--input-backend=reedline"]
    ignore_stderr: true
    test_files:
      - path: "run.sh"
        contents: |
          for value in -9 invalid +12 7ms; do
            bind "set keyseq-timeout $value"
            bind "set completion-query-items $value"
            bind "set completion-prefix-display-length $value"
            bind -v | LC_ALL=C grep -E '^set (keyseq-timeout|completion-query-items|completion-prefix-display-length) ' | LC_ALL=C sort
          done
          bind 'set editing-mode Vi'
          bind -v | grep '^set editing-mode '

  - name: "bind -X round trips quotes, backslashes and non-ASCII commands"
    args: ["run.sh"]
    removed_default_args: ["--input-backend=basic"]
    additional_test_args: ["--input-backend=reedline"]
    # Some Bash builds change the serialized meta escapes on reload.
    skip_oracle: true
    ignore_stderr: true
    expected_exit_code: 0
    test_files:
      - path: "run.sh"
        contents: |
          bind -x '"\C-t": printf "\"%s\"\n" café' || exit
          definition=$(bind -X) || exit
          test -n "$definition" || exit 1
          bind -r '\C-t' || exit
          bind -x "$definition" || exit
          test "$(bind -X)" = "$definition"
